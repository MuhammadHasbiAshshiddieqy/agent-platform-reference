[project]
name = "contracts"
version = "0.1.0"
description = "Shared Pydantic v2 contracts for the Duta agent platform — the only module every service may import (§4.1)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
