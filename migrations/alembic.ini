[alembic]
script_location = %(here)s
prepend_sys_path = .
path_separator = os
version_path_separator = os

# sqlalchemy.url is intentionally absent — env.py sets it from the
# DATABASE_URL environment variable so the same migrations run against
# localhost (dev, `make migrate`) or a service hostname (CI) without
# editing this file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
