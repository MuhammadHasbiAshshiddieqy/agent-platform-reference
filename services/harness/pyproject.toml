[project]
name = "harness"
version = "0.1.0"
description = "agent-harness — orchestrates the agent loop (§5.3)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    # langgraph-checkpoint-postgres depends on plain `psycopg`, which has
    # no working backend on a slim base image without this — no libpq,
    # no compiled C extension, ImportError at runtime ("no pq wrapper
    # available"). [binary] ships a prebuilt wheel, no libpq needed.
    "psycopg[binary]>=3.2",
    "langfuse>=2.50,<3",
    "pydantic-settings>=2.5",
    # §9 guardrails. presidio-analyzer's AnalyzerEngine needs an NLP engine
    # for tokenization even when every recognizer is a pure-regex
    # PatternRecognizer (NIK/NPWP/no. rekening/no. HP all are) — we give it
    # spacy.blank("id") (guardrails/pii.py), which needs no downloaded
    # model, so `spacy` alone is enough here, no `en_core_web_*` weights.
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.7,<4",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    # §22.6 killswitch reads (harness's own Redis db, distinct from
    # gateway's quota db — see config.py's redis_url docstring).
    "redis>=5.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
