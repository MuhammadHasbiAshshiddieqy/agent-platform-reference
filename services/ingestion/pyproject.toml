[project]
name = "ingestion"
version = "0.1.0"
description = "ingestion-service — RAG write side: connector, chunk, embed, upsert catalog.chunks (§5.11)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
