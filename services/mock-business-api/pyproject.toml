[project]
name = "mock-business-api"
version = "0.1.0"
description = "mock-business-api — §8.4 mutation contract + §24 mock domain adapter (hr/payroll)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "pyjwt>=2.9",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_business_api"]
