[project]
name = "gateway"
version = "0.1.0"
description = "agent-gateway — public entrypoint: schema validation, idempotency, sync/async routing (§5.2)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "redis>=5.0",
    "prometheus-client>=0.20",
    # §5.9 — publishes AsyncJobMessage to RabbitMQ for the async path.
    "aio-pika>=9.4",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
