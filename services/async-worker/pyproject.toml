[project]
name = "async-worker"
version = "0.1.0"
description = "async-worker — §5.10's job executor: consumes RabbitMQ, calls agent-harness, sends webhooks"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.5",
    "prometheus-client>=0.20",
    "redis>=5.0",
    "aio-pika>=9.4",
    "pyyaml>=6.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_worker"]
