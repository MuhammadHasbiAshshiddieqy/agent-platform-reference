[project]
name = "mock-idp"
version = "0.1.0"
description = "mock-idp — §22.5 RFC 8693 token exchange + §22.3 claim issuance (ADR-009)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "pyjwt>=2.9",
    # RFC 8693 token-exchange is form-encoded (grant_type=...), not JSON —
    # FastAPI's Form() needs this to parse it.
    "python-multipart>=0.0.12",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_idp"]
