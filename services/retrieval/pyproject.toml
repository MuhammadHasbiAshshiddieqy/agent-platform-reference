[project]
name = "retrieval"
version = "0.1.0"
description = "retrieval-service — RAG read side: hybrid search, rerank, ACL filtering (§5.5)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.5",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
