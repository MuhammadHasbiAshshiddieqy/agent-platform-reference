[project]
name = "eval-service"
version = "0.1.0"
description = "eval-service — §13's CI eval gate, a CLI tool not a long-running server"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.7,<4",
    # §13.4 — ragas judge wrapper, pinned to LangChain's OpenAI-compatible
    # client since model-router speaks the OpenAI API regardless of what
    # backs `eval-judge` (§5.4 boundary #3: never a provider SDK).
    # Pinned to the 0.2.x line, not latest (0.4.x): 0.4's `ragas.llms`
    # imports `langchain_community.chat_models.vertexai.ChatVertexAI` at
    # module load time unconditionally, which doesn't exist in the
    # `langchain-community` version that resolves alongside it — an
    # ImportError on the package's own `import ragas`, confirmed live,
    # not a hypothetical. 0.2.15 has no such issue and still exposes the
    # exact `LangchainLLMWrapper`/`LangchainEmbeddingsWrapper` API §13.4
    # specifies verbatim.
    "ragas==0.2.15",
    # Pinned <0.3: langchain-openai>=0.3 pulls in the langchain 1.x
    # generation (langchain-core>=1.0), where langchain-community dropped
    # `chat_models.vertexai` entirely — ragas 0.2.15's own `ragas.llms`
    # imports that unconditionally at module load time, so anything
    # newer breaks `import ragas` itself (confirmed live). <0.3 keeps
    # the whole langchain-core/-community family on the 0.2.x/0.3.x line
    # ragas 0.2.15 was actually built against.
    "langchain-openai>=0.2,<0.3",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_service"]
