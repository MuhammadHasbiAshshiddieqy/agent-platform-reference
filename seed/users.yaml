# §26.1 demo seed data. Read directly by mock-idp (M5b) AND mock-business-api
# (M5) — never copied into either service (ADR-009, §27.1, §28.10): if the
# two ever had separate copies, "what the agent may ask for" and "what
# business-api will actually allow" would drift apart, and the demo would
# fail in a way that's confusing to debug.
#
# Permission sets follow the role table in §22.3, which is written as
# cumulative ("+" per row). Two judgment calls made filling that table in
# for concrete users (not one of the §0 mandatory stop-and-ask areas, but
# worth flagging):
#   - `employee` includes `leave.balance.read` (self) even though §22.3's
#     table only lists it starting at `team_lead` (team scope) — demo step
#     1 (§26.2) has an `employee` call get_leave_balance for themselves, so
#     the self-scope grant has to exist somewhere.
#   - `finance` is NOT given hr_manager's `payroll.adjust`/`employee.read`
#     despite the table's cumulative "+" notation implying it might — an
#     employee approving reimbursements has no business adjusting payroll
#     or reading arbitrary HR records. Treated as illustrative shorthand,
#     not literal role inheritance across unrelated business functions.

tenants:
  - tenant_id: tnt_demo
    description: Primary demo tenant (§26.2 — all eight demo steps run here)
  - tenant_id: tnt_eval
    description: eval-service tenant (§13.1, §13.7) — separate corpus, impersonation only allowed here
  - tenant_id: tnt_other
    description: Isolation control tenant (§26.1) — 1 user, 1 document, proves tenant isolation, never appears in the demo script itself

